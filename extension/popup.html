<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 320px;
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #e2e8f0;
      box-sizing: border-box;
    }
    h2 {
      margin: 0 0 12px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
    }
    .box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 10px;
      font-family: monospace;
      font-size: 11px;
      word-break: break-all;
      max-height: 70px;
      overflow-y: auto;
      margin-bottom: 12px;
      color: #38bdf8;
    }
    .btn {
      display: block;
      width: 100%;
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .btn:hover {
      background: #1d4ed8;
    }
    .btn-secondary {
      background: #334155;
      color: #f1f5f9;
    }
    .btn-secondary:hover {
      background: #475569;
    }
    .status {
      font-size: 11px;
      color: #10b981;
      text-align: center;
      min-height: 14px;
    }
    .error {
      color: #ef4444;
    }
  </style>
</head>
<body>
  <h2>Token CreatorsArea</h2>
  <div id="tokenBox" class="box">Chargement...</div>
  <button id="copyCmdBtn" class="btn">Copier la commande serveur</button>
  <button id="copyTokenBtn" class="btn btn-secondary">Copier le token seul</button>
  <div id="status" class="status"></div>
  <script src="popup.js"></script>
</body>
</html>
